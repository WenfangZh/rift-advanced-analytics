[project]
name = "rift"
version = "0.1.0"
description = "Crawler and analytics database for EUW Diamond+ ranked solo/duo League of Legends games"
readme = "README.md"
authors = [
    { name = "WenfangZh", email = "75441582+WenfangZh@users.noreply.github.com" }
]
requires-python = ">=3.12"
dependencies = [
    "duckdb>=1.5.6",
    "httpx>=0.28.1",
    "python-dotenv>=1.2.4",
]

[project.scripts]
rift = "rift.cli:main"

[build-system]
requires = ["uv_build>=0.12.3,<0.13.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "pytest>=9.1.1",
    "ruff>=0.17.0",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"

[tool.ruff]
line-length = 100
target-version = "py312"
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "SIM", "ASYNC", "RUF"]
ignore = ["E501"]
